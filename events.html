<!DOCTYPE html>
<html lang="en">
<head>
   
    <link rel="icon" type="image/jpeg" href="1000034613.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | House of Judah</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            background: #2d0b5a; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            text-align: center;
        }
        nav { 
            background: #2d0b5a; 
            padding: 1.5rem 5%; 
            border-bottom: 3px solid #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-text { 
            color: #d4af37; 
            font-weight: bold; 
            letter-spacing: 2px; 
            font-size: 1.5rem; 
            text-transform: uppercase;
            text-decoration: none;
        }
        .container { 
            flex: 1; 
            padding: 40px 20px; 
            max-width: 700px; 
            margin: auto; 
        }
        h1 { color: #d4af37; margin-bottom: 30px; font-size: 2.2rem; }
        
        .event-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-left: 5px solid #d4af37;
            text-align: left;
        }
        .event-date {
            color: #d4af37;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 5px;
        }
        .event-title {
            font-size: 1.4rem;
            margin: 0 0 10px 0;
            color: #fff;
        }

        /* Button with Google Calendar Logo */
        .cal-btn {
            background: #ffffff;
            color: #3c4043; /* Google's dark grey text color */
            border: 1px solid #dadce0;
            padding: 10px 24px;
            text-decoration: none;
            border-radius: 24px; /* More rounded Google style */
            font-size: 1rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            transition: background-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }
        
        .cal-btn img {
            width: 24px;
            height: 24px;
            margin-right: 12px;
        }

        .cal-btn:hover {
            background-color: #f8f9fa;
            box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            color: #d4af37;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
        }
        footer { 
            background: #1a1a1a; 
            color: #aaa; 
            padding: 25px; 
            font-size: 0.85rem; 
            margin-top: auto;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo-text">HOUSE OF JUDAH</a>
    </nav>

    <div class="container">
        <h1>Upcoming Events</h1>
        
        <div class="event-card">
            <span class="event-date">May 23 - May 24, 2026</span>
            <h3 class="event-title">Pentecost / Feast of Weeks</h3>
            <p>Observing the Feast from sunset to sunset.</p>
            
            <a href="https://www.google.com/calendar/render?action=TEMPLATE&text=Pentecost%2F+Feasts+Of+Weeks&dates=20260523T203000/20260524T203000&details=Observing+the+Feast+from+sunset+to+sunset." 
               target="_blank" 
               class="cal-btn">
               <img src="unnamed(1).png" alt="Google Calendar">
               Add to Calendar
            </a>
        </div>

        <a href="index.html" class="back-btn">← Back to Home</a>
    </div>

    <footer>2026 House of Judah</footer>

</body>
</html>
            </a>
        </div>
        <br><br><a href="index.html" style="color:#2d0b5a; text-decoration:none; font-weight:bold;">← Back Home</a>
    </div>
</body>
</html>
