            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .lookup-btn:hover {
            background: #f1c40f;
        }

        .scroll-btn {

            height: 45px;
            border-radius: 50%;

            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            opacity: 0; /* Invisible by default */
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s, transform 0.2s;
            z-index: 1000;
        }
        .scroll-btn.show {
            opacity: 1;
            visibility: visible;
        }
        .scroll-btn:hover {
            background: #f1c40f;
            transform: scale(1.1);
        }
